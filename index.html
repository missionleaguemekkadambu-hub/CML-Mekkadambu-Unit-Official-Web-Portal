            'കോതമംഗലം രൂപതയുടെ കീഴിലുള്ള വിശുദ്ധ യൂദാശ്ലീഹാ സീറോ-മലബാർ കത്തോലിക്കാ ദേവാലയം, മേക്കടമ്പ് ഇടവകയിൽ പ്രവർത്തിക്കുന്ന ചെറുപുഷ്പ മിഷൻ ലീഗ് മേക്കടമ്പ് ശാഖയുടെ ഔദ്യോഗിക വെബ് പോർട്ടലിലേക്ക് സ്വാഗതം. അസാധ്യ കാര്യങ്ങളുടെ മധ്യസ്ഥനായ വിശുദ്ധ യൂദാശ്ലീഹായുടെയും വിശുദ്ധ കൊച്ചുത്രേസ്യായുടെയും മധ്യസ്ഥതയിൽ, കുഞ്ഞുങ്ങളുടെയും യുവജനങ്ങളുടെയും ഹൃദയങ്ങളിൽ വിശ്വാസവും പ്രേഷിത ചൈതന്യവും നിസ്വാർത്ഥ സേവന മനോഭാവവും വളർത്തിയെടുക്കുക എന്നതാണ് ഞങ്ങളുടെ ലക്ഷ്യം.',
          communityTitle: 'ഞങ്ങളുടെ വിശ്വാസ സമൂഹം',

          whatBody:
            'കത്തോലിക്കാ കുട്ടികളിലും യുവജനങ്ങളിലും പ്രേഷിത ചൈതന്യവും ആത്മീയ വളർച്ചയും വ്യക്തിത്വ വികസനവും വളർത്തിയെടുക്കുന്നതിനായി സ്ഥാപിതമായ തദ്ദേശീയ അല്മായ പ്രേഷിത സംഘടനയാണ് ചെറുപുഷ്പ മിഷൻ ലീഗ്. 1947-ൽ ഭാരതത്തിൽ സ്ഥാപിതമായ ഈ പ്രസ്ഥാനം ഇന്ന് ഏഷ്യയിലെ തന്നെ ഏറ്റവും വലിയ കുട്ടികളുടെ പ്രേഷിത മുന്നേറ്റങ്ങളിലൊന്നായി വളർന്നിരിക്കുന്നു.',

    // =========================================================================
    // SACRED ARCHITECTURAL ICONS
    // =========================================================================
    function SacredCross({ className = 'w-4 h-4' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" className={className} aria-hidden="true">
          <path d="M12 2.5v19M6.5 8h11" strokeLinecap="round" />
        </svg>
      );
    }

    function LittleFlowerCrest({ className = 'w-8 h-8' }) {
      return (
        <svg viewBox="0 0 40 40" fill="none" className={className} aria-hidden="true">
          <circle cx="20" cy="20" r="18" stroke="#C59237" strokeWidth="1.2" strokeDasharray="2.5 2.5" />
          <path
            d="M20 9.5C16.2 9.5 13.5 12.5 13.5 16.2C13.5 21 20 27.5 20 27.5C20 27.5 26.5 21 26.5 16.2C26.5 12.5 23.8 9.5 20 9.5Z"
            fill="#7A1C33"
            fillOpacity="0.12"
            stroke="#7A1C33"
            strokeWidth="1.5"
          />
          <path d="M20 12.5v9M16.5 16h7" stroke="#C59237" strokeWidth="1.4" strokeLinecap="round" />
        </svg>
      );
    }

    // =========================================================================
    // LEADER CARD: LEFT PHOTO + RIGHT NAME, POSITION & DESCRIPTION
    // =========================================================================
    function LeaderSplitCard({
      name,
      position,
      description,
      badge,
      photoUrl,
      onAttachPhoto,
      attachLabel,
      changeLabel,
      slotLabel,
      spotlight = false,
      tier = 'standard'
    }) {
      const inputRef = useRef(null);

      const containerClasses =
        tier === 'patron'
          ? 'bg-gradient-to-br from-white via-goldSoft/45 to-amber-50/80 border-antiqueGold shadow-xl ring-1 ring-antiqueGold/30 p-6 sm:p-8'
          : spotlight
          ? 'bg-gradient-to-br from-white to-goldSoft/25 border-antiqueGold/65 shadow-md p-5 sm:p-6'
          : 'bg-white/90 border-hairline hover:border-antiqueGold/70 hover:shadow-md shadow-sm p-4 sm:p-5';

      return (
        <article className={`rounded-3xl border backdrop-blur-md transition-all duration-300 ${containerClasses}`}>
          <div className="flex flex-col sm:flex-row items-start gap-5 sm:gap-6">
            {/* LEFT SIDE: PORTRAIT FRAME */}
            <div className="w-full sm:w-32 md:w-36 shrink-0 flex flex-col items-center">
              <div
                className={`w-28 h-36 sm:w-32 sm:h-40 rounded-2xl overflow-hidden border-2 flex items-center justify-center relative shadow-inner ${
                  tier === 'patron' || spotlight
                    ? 'border-antiqueGold/80 bg-gradient-to-b from-goldSoft/60 to-white'
                    : 'border-hairline bg-alabaster'
                }`}
              >
                {photoUrl ? (
                  <img
                    src={photoUrl}
                    alt={name}
                    className="w-full h-full object-cover"
                    onError={(e) => {
                      e.currentTarget.style.display = 'none';
                    }}
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center text-center px-2 text-crimson/70">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.3" className="w-9 h-9 mb-1 text-antiqueGold">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    <span className="text-[10px] font-semibold uppercase tracking-widest text-stoneMuted">
                      {slotLabel}
                    </span>
                  </div>
                )}
              </div>

              {onAttachPhoto && (
                <>
                  <input
                    ref={inputRef}
                    type="file"
                    accept="image/*"
                    className="hidden"
                    onChange={(e) => {
                      const file = e.target.files?.[0];
                      if (file) {
                        onAttachPhoto(URL.createObjectURL(file));
                      }
                    }}
                  />
                  <button
                    type="button"
                    onClick={() => inputRef.current?.click()}
                    className="mt-2.5 px-3 py-1 rounded-full bg-goldSoft/70 hover:bg-crimson hover:text-white text-[11px] font-semibold text-crimson transition-colors"
                  >
                    {photoUrl ? changeLabel : attachLabel}
                  </button>
                </>
              )}
            </div>

            {/* RIGHT SIDE: NAME, POSITION, DESCRIPTION */}
            <div className="flex-1 min-w-0">
              {badge && (
                <span className="inline-flex items-center gap-1.5 mb-2.5 px-3.5 py-1 rounded-full text-[11px] font-bold tracking-wide bg-gradient-to-r from-crimson to-sapphire text-white shadow-sm">
                  <SacredCross className="w-3 h-3 text-antiqueGold" />
                  <span>{badge}</span>
                </span>
              )}

              <h3
                className={`font-serif font-bold text-crimson leading-snug ${
                  tier === 'patron' ? 'text-2xl sm:text-3xl' : spotlight ? 'text-xl sm:text-2xl' : 'text-lg sm:text-xl'
                }`}
              >
                {name}
              </h3>

              <p className="text-sm font-bold text-saffron mt-0.5">
                {position}
              </p>

              <p className="text-sm text-charcoal/85 leading-relaxed mt-3">
                {description}
              </p>
            </div>
          </div>
        </article>
      );
    }

                    <div className="rounded-2xl bg-gradient-to-b from-goldSoft/70 to-alabaster p-3.5 border border-antiqueGold/35">
                      <dt className="text-[11px] uppercase tracking-wider font-semibold text-stoneMuted">{t.unitIdLabel}</dt>
                      <dd className="text-xl font-serif font-extrabold text-crimson mt-0.5">{t.unitIdValue}</dd>
                    </div>
                    <div className="rounded-2xl bg-gradient-to-b from-blue-50/80 to-alabaster p-3.5 border border-sapphire/20">
                      <dt className="text-[11px] uppercase tracking-wider font-semibold text-stoneMuted">{t.membersLabel}</dt>
                      <dd className="text-xl font-serif font-extrabold text-sapphire mt-0.5">{t.membersValue}</dd>
                    </div>
                  </dl>

                  <div className="mt-4 pt-3 border-t border-hairline text-center">
                    <p className="text-xs font-bold text-saffron">
                      {t.mission.sloganValue}
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* Welcome Statement */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm">
            <div className="flex items-center gap-3 mb-3">
              <LittleFlowerCrest className="w-8 h-8 shrink-0" />
              <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">
                {s.welcomeTitle}
              </h2>
            </div>
            <p className="text-sm sm:text-base text-charcoal/85 leading-relaxed">
              {s.welcomeBody}
            </p>
          </section>

          {/* About Our Faith Community */}
          <section className="space-y-5">
            <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">
              {s.communityTitle}
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="rounded-3xl bg-gradient-to-br from-white to-blue-50/40 border border-sapphire/20 p-6 sm:p-7 shadow-sm space-y-2.5">
                <span className="inline-block px-3 py-0.5 rounded-full bg-sapphire/10 text-[11px] font-bold uppercase tracking-wider text-sapphire">
                  {t.dioceseName}
                </span>
                <h3 className="font-serif text-xl sm:text-2xl font-bold text-sapphire">
                  {s.parishCardTitle}
                </h3>
                <p className="text-sm text-charcoal/80 leading-relaxed">
                  {s.parishCardBody}
                </p>
              </div>

              <div className="rounded-3xl bg-gradient-to-br from-white to-goldSoft/45 border border-antiqueGold/35 p-6 sm:p-7 shadow-sm space-y-2.5">
                <span className="inline-block px-3 py-0.5 rounded-full bg-crimson/10 text-[11px] font-bold uppercase tracking-wider text-crimson">
                  {t.unitIdLabel}: {t.unitIdValue} • {t.membersLabel}: {t.membersValue}
                </span>
                <h3 className="font-serif text-xl sm:text-2xl font-bold text-crimson">
                  {s.cmlCardTitle}
                </h3>
                <p className="text-sm text-charcoal/80 leading-relaxed">
                  {s.cmlCardBody}
                </p>
              </div>
            </div>
          </section>

          {/* Sacramental & Prayer Schedule */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-6">
            <div className="border-b border-hairline pb-4">
              <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">
                {s.scheduleTitle}
              </h2>
              <p className="text-xs sm:text-sm text-stoneMuted mt-1">
                {s.scheduleSubtitle}
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              {s.scheduleItems.map((item) => (
                <div
                  key={item.title}
                  className={`rounded-2xl p-5 border transition-all ${
                    item.highlight
                      ? 'bg-gradient-to-br from-goldSoft/80 to-amber-50/70 border-antiqueGold/60 shadow-sm'
                      : 'bg-alabaster border-hairline'
                  }`}
                >
                  <p className="text-xs uppercase tracking-wider font-bold text-crimson">
                    {item.title}
                  </p>
                  <p className="text-sm font-bold text-charcoal mt-2">
                    {item.time}
                  </p>
                </div>
              ))}
            </div>
          </section>

          {/* Parish & CML Highlights */}
          <section className="space-y-5">
            <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">
              {s.highlightsTitle}
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {s.highlights.map((h, idx) => {
                const accents = [
                  'from-white to-amber-50/50 border-antiqueGold/40',
                  'from-white to-rose-50/50 border-crimson/25',
                  'from-white to-emerald-50/50 border-emeraldSacred/25'
                ];
                return (
                  <div key={h.title} className={`rounded-3xl bg-gradient-to-br ${accents[idx % 3]} border p-6 shadow-sm space-y-2`}>
                    <h3 className="font-serif text-xl font-bold text-crimson">{h.title}</h3>
                    <p className="text-sm text-charcoal/80 leading-relaxed">{h.body}</p>
                  </div>
                );
              })}
            </div>
          </section>
        </div>
      );
    }

    // 2. THE MISSION (About CML)
    function MissionView({
      t,
      unitLogoUrl,
      onUploadUnitLogo,
      cmlFlagUrl,
      onUploadCmlFlag,
      cmlBadgeUrl,
      onUploadCmlBadge
    }) {
      const m = t.mission;
      const [anthemTab, setAnthemTab] = useState('both');
      const logoRef = useRef(null);
      const flagRef = useRef(null);
      const badgeRef = useRef(null);

      return (
        <div className="page-enter space-y-12">
          <header className="rounded-[2rem] bg-gradient-to-r from-white via-goldSoft/40 to-white border border-antiqueGold/50 p-7 sm:p-10 shadow-sm">
            <p className="text-xs font-bold uppercase tracking-widest text-saffron">
              {m.eyebrow}
            </p>
            <h1 className="font-serif text-3xl sm:text-4xl font-bold text-crimson mt-1">
              {m.title}
            </h1>
            <p className="text-sm sm:text-base text-stoneMuted mt-1">{m.subtitle}</p>
          </header>

          {/* What is CML */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-3">
            <h2 className="font-serif text-2xl font-bold text-crimson">{m.whatTitle}</h2>
            <p className="text-sm sm:text-base text-charcoal/85 leading-relaxed">{m.whatBody}</p>
          </section>

          {/* History & Founding */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-5">
            <h2 className="font-serif text-2xl font-bold text-crimson">{m.historyTitle}</h2>
            <p className="text-sm sm:text-base text-charcoal/85 leading-relaxed">{m.historyIntro}</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
              {m.historyCards.map((c) => (
                <div key={c.heading} className="rounded-2xl bg-alabaster border border-hairline p-5">
                  <h3 className="text-xs uppercase tracking-wider font-bold text-crimson">{c.heading}</h3>
                  <p className="text-sm text-charcoal/80 mt-2 leading-relaxed">{c.body}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Founders Cards */}
          <section className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {m.founders.map((f) => (
              <div key={f.name} className="rounded-3xl bg-white/95 border border-hairline p-6 sm:p-7 shadow-sm">
                <span className="inline-block px-3.5 py-0.5 rounded-full bg-goldSoft text-crimson text-xs font-bold mb-2">
                  {f.tag}
                </span>
                <h3 className="font-serif text-2xl font-bold text-crimson">{f.name}</h3>
                <dl className="mt-4 space-y-2 text-sm border-t border-hairline pt-3">
                  {f.rows.map(([k, v]) => (
                    <div key={k} className="flex justify-between gap-4">
                      <dt className="text-stoneMuted">{k}</dt>
                      <dd className="font-semibold text-charcoal text-right">{v}</dd>
                    </div>
                  ))}
                </dl>
              </div>
            ))}
          </section>

          {/* Patrons Summary & Motto/Slogan/Emblem */}
          <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="rounded-3xl bg-white/95 border border-hairline p-6 sm:p-8 shadow-sm space-y-4">
              <h2 className="font-serif text-2xl font-bold text-crimson">{m.patronsSummaryTitle}</h2>
              <div className="rounded-2xl bg-goldSoft/60 border border-antiqueGold/45 p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-saffron">{m.chiefPatronLabel}</p>
                <p className="text-sm text-charcoal/90 mt-1 leading-relaxed">{m.chiefPatronText}</p>
              </div>
              <div className="rounded-2xl bg-alabaster border border-hairline p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-crimson">{m.coPatronsLabel}</p>
                <p className="text-sm text-charcoal/90 mt-1 leading-relaxed">{m.coPatronsText}</p>
              </div>
            </div>

            <div className="rounded-3xl bg-white/95 border border-hairline p-6 sm:p-8 shadow-sm space-y-4">
              <h2 className="font-serif text-2xl font-bold text-crimson">{m.identityTitle}</h2>
              <div className="rounded-2xl bg-alabaster border border-hairline p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-crimson">{m.mottoLabel}</p>
                <p className="text-sm font-semibold text-charcoal mt-1">{m.mottoQuote}</p>
                <p className="text-xs text-stoneMuted mt-1">{m.mottoNote}</p>
              </div>
              <div className="rounded-2xl bg-goldSoft/60 border border-antiqueGold/45 p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-saffron">{m.sloganLabel}</p>
                <p className="text-base font-bold text-crimson mt-1">{m.sloganValue}</p>
              </div>
              <div className="rounded-2xl bg-alabaster border border-hairline p-4">
                <p className="text-xs uppercase tracking-wider font-bold text-crimson">{m.emblemLabel}</p>
                <p className="text-sm text-charcoal/85 mt-1 leading-relaxed">{m.emblemDesc}</p>
              </div>
            </div>
          </section>

          {/* Key Objectives */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-5">
            <h2 className="font-serif text-2xl font-bold text-crimson">{m.objectivesTitle}</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {m.objectives.map((obj) => (
                <div key={obj.title} className="rounded-2xl bg-alabaster border border-hairline p-5">
                  <h3 className="font-bold text-crimson text-base">{obj.title}</h3>
                  <p className="text-sm text-charcoal/80 mt-2 leading-relaxed">{obj.body}</p>
                </div>
              ))}
            </div>
          </section>

          {/* Unit Highlight Banner */}
          <section className="rounded-[2rem] bg-gradient-to-r from-crimson via-[#65152A] to-sapphire text-white p-6 sm:p-9 shadow-lg space-y-2">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <h2 className="font-serif text-2xl font-bold">{m.unitBannerTitle}</h2>
              <span className="px-3.5 py-1 rounded-full bg-white/15 text-goldSoft text-xs font-bold border border-white/20">
                {t.unitIdLabel}: {t.unitIdValue} • {t.membersLabel}: {t.membersValue}
              </span>
            </div>
            <p className="text-sm text-white/90 leading-relaxed">{m.unitBannerBody}</p>
          </section>

          {/* Logo, Flag & Badge — ALL THREE WITH INTERACTIVE UPLOAD SLOTS */}
          <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* 1. CML LOGO */}
            <div className="rounded-3xl bg-white/95 border border-antiqueGold/55 p-6 shadow-sm flex flex-col items-center justify-between text-center">
              <div className="flex flex-col items-center">
                <span className="text-xs uppercase tracking-wider font-bold text-saffron mb-3">{m.symbols.logo}</span>
                <div className="w-32 h-28 rounded-2xl bg-alabaster border border-hairline flex items-center justify-center p-2 mb-3 overflow-hidden">
                  {unitLogoUrl ? (
                    <img src={unitLogoUrl} alt={m.symbols.logo} className="w-full h-full object-contain" />
                  ) : (
                    <LittleFlowerCrest className="w-16 h-16" />
                  )}
                </div>
                <p className="text-xs text-stoneMuted leading-relaxed mb-4">{m.symbols.logoDesc}</p>
              </div>

              <div>
                <input
                  ref={logoRef}
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (file) onUploadUnitLogo(URL.createObjectURL(file));
                  }}
                />
                <button
                  type="button"
                  onClick={() => logoRef.current?.click()}
                  className="px-4 py-2 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs font-semibold transition-colors shadow-sm"
                >
                  {unitLogoUrl ? m.symbols.replaceLogo : m.symbols.uploadLogo}
                </button>
              </div>
            </div>

            {/* 2. CML FLAG */}
            <div className="rounded-3xl bg-white/95 border border-antiqueGold/55 p-6 shadow-sm flex flex-col items-center justify-between text-center">
              <div className="flex flex-col items-center">
                <span className="text-xs uppercase tracking-wider font-bold text-saffron mb-3">{m.symbols.flag}</span>
                <div className="w-36 h-28 rounded-2xl bg-alabaster border border-hairline flex items-center justify-center p-2 mb-3 overflow-hidden">
                  {cmlFlagUrl ? (
                    <img src={cmlFlagUrl} alt={m.symbols.flag} className="w-full h-full object-contain" />
                  ) : (
                    <div className="w-32 h-20 rounded-xl bg-gradient-to-r from-saffron to-amber-500 border border-antiqueGold/50 flex items-center justify-center text-white font-serif font-bold text-xs shadow-inner px-2">
                      {m.symbols.flag}
                    </div>
                  )}
                </div>
                <p className="text-xs text-stoneMuted leading-relaxed mb-4">{m.symbols.flagDesc}</p>
              </div>

              <div>
                <input
                  ref={flagRef}
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (file) onUploadCmlFlag(URL.createObjectURL(file));
                  }}
                />
                <button
                  type="button"
                  onClick={() => flagRef.current?.click()}
                  className="px-4 py-2 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs font-semibold transition-colors shadow-sm"
                >
                  {cmlFlagUrl ? m.symbols.replaceFlag : m.symbols.uploadFlag}
                </button>
              </div>
            </div>

            {/* 3. CML BADGE */}
            <div className="rounded-3xl bg-white/95 border border-antiqueGold/55 p-6 shadow-sm flex flex-col items-center justify-between text-center">
              <div className="flex flex-col items-center">
                <span className="text-xs uppercase tracking-wider font-bold text-saffron mb-3">{m.symbols.badge}</span>
                <div className="w-32 h-28 rounded-2xl bg-alabaster border border-hairline flex items-center justify-center p-2 mb-3 overflow-hidden">
                  {cmlBadgeUrl ? (
                    <img src={cmlBadgeUrl} alt={m.symbols.badge} className="w-full h-full object-contain" />
                  ) : (
                    <div className="w-24 h-24 rounded-full bg-goldSoft/80 border-2 border-antiqueGold flex items-center justify-center">
                      <SacredCross className="w-10 h-10 text-crimson" />
                    </div>
                  )}
                </div>
                <p className="text-xs text-stoneMuted leading-relaxed mb-4">{m.symbols.badgeDesc}</p>
              </div>

              <div>
                <input
                  ref={badgeRef}
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => {
                    const file = e.target.files?.[0];
                    if (file) onUploadCmlBadge(URL.createObjectURL(file));
                  }}
                />
                <button
                  type="button"
                  onClick={() => badgeRef.current?.click()}
                  className="px-4 py-2 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs font-semibold transition-colors shadow-sm"
                >
                  {cmlBadgeUrl ? m.symbols.replaceBadge : m.symbols.uploadBadge}
                </button>
              </div>
            </div>
          </section>

          {/* Mission Anthem */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-5">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-hairline pb-4">
              <div>
                <h2 className="font-serif text-2xl font-bold text-crimson">{m.anthemTitle}</h2>
                <p className="text-xs text-stoneMuted mt-0.5">{m.anthemSubtitle}</p>
              </div>
              <div className="inline-flex rounded-full bg-alabaster p-1 border border-hairline">
                {[
                  { id: 'both', label: 'All' },
                  { id: 'ml', label: 'മലയാളം' },
                  { id: 'en', label: 'English' }
                ].map((opt) => (
                  <button
                    key={opt.id}
                    type="button"
                    onClick={() => setAnthemTab(opt.id)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-colors ${
                      anthemTab === opt.id ? 'bg-crimson text-white' : 'text-stoneMuted hover:text-charcoal'
                    }`}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>

            <div className={`grid grid-cols-1 ${anthemTab === 'both' ? 'lg:grid-cols-2' : ''} gap-6`}>
              {(anthemTab === 'both' || anthemTab === 'ml') && (
                <div className="rounded-2xl bg-alabaster border border-hairline p-6">
                  <h3 className="font-malayalam font-bold text-crimson mb-3 text-base">
                    Malayalam Lyrics (മലയാളം)
                  </h3>
                  <pre className="whitespace-pre-wrap font-malayalam text-sm sm:text-base text-charcoal leading-relaxed">
                    {ANTHEM_MALAYALAM}
                  </pre>
                </div>
              )}
              {(anthemTab === 'both' || anthemTab === 'en') && (
                <div className="rounded-2xl bg-alabaster border border-hairline p-6">
                  <h3 className="font-serif font-bold text-crimson mb-3 text-lg">
                    ENGLISH LYRICS (ENGLISH)
                  </h3>
                  <pre className="whitespace-pre-wrap font-sans text-sm sm:text-base text-charcoal leading-relaxed">
                    {ANTHEM_ENGLISH}
                  </pre>
                </div>
              )}
            </div>
          </section>
        </div>
      );
    }

    // 3. INTERCESSORS (Heavenly Patrons)
    function IntercessorsView({ t }) {
      const p = t.intercessors;
      return (
        <div className="page-enter space-y-12">
          <header className="rounded-[2rem] bg-gradient-to-r from-white via-goldSoft/40 to-white border border-antiqueGold/50 p-7 sm:p-10 shadow-sm">
            <p className="text-xs font-bold uppercase tracking-widest text-saffron">{p.eyebrow}</p>
            <h1 className="font-serif text-3xl sm:text-4xl font-bold text-crimson mt-1">{p.title}</h1>
            <p className="text-sm sm:text-base text-stoneMuted mt-1">{p.subtitle}</p>
          </header>

          {/* Chief Patroness */}
          <section className="rounded-[2rem] bg-white/95 border border-antiqueGold/60 p-6 sm:p-9 shadow-sm space-y-5">
            <span className="inline-block px-3.5 py-1 rounded-full bg-goldSoft text-crimson text-xs font-bold">
              {p.chiefBadge}
            </span>
            <div>
              <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">{p.chiefName}</h2>
              <p className="text-xs uppercase tracking-wider font-bold text-saffron mt-1">{p.chiefRole}</p>
            </div>
            <p className="text-sm sm:text-base text-charcoal/85 leading-relaxed">{p.chiefIntro}</p>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {p.chiefPoints.map((pt) => (
                <div key={pt.title} className="rounded-2xl bg-alabaster border border-hairline p-5">
                  <h3 className="font-bold text-crimson">{pt.title}</h3>
                  <p className="text-sm text-charcoal/80 mt-1.5 leading-relaxed">{pt.body}</p>
                </div>
              ))}
            </div>

            <blockquote className="rounded-2xl bg-goldSoft/60 border-l-4 border-crimson p-4 italic text-crimson font-medium text-sm sm:text-base">
              {p.chiefQuote}
              <footer className="not-italic text-xs text-stoneMuted mt-1">— {p.chiefQuoteBy}</footer>
            </blockquote>
          </section>

          {/* Co-Patrons */}
          <section className="space-y-5">
            <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">{p.coPatronsTitle}</h2>
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {p.coPatrons.map((cp) => (
                <article key={cp.name} className="rounded-3xl bg-white/95 border border-hairline p-6 shadow-sm flex flex-col justify-between space-y-5">
                  <div className="space-y-3">
                    <span className="text-xs font-bold uppercase tracking-wider text-saffron">{cp.tag}</span>
                    <h3 className="font-serif text-2xl font-bold text-crimson">{cp.name}</h3>
                    <p className="text-sm text-charcoal/80 leading-relaxed">{cp.intro}</p>
                    <ul className="space-y-2 text-xs text-charcoal/90 pt-1">
                      {cp.bullets.map((b) => (
                        <li key={b.label} className="leading-relaxed">
                          <strong className="text-crimson">{b.label}:</strong> {b.text}
                        </li>
                      ))}
                    </ul>
                  </div>

                  <blockquote className="rounded-2xl bg-alabaster border border-hairline p-3.5 text-xs italic text-crimson">
                    {cp.quote}
                    <span className="block not-italic text-stoneMuted mt-1">— {cp.quoteBy}</span>
                  </blockquote>
                </article>
              ))}
            </div>
          </section>

          {/* Parish Patron */}
          <section className="rounded-[2rem] bg-gradient-to-br from-crimson via-[#5C1327] to-sapphire text-white p-6 sm:p-9 shadow-lg space-y-5">
            <span className="inline-block px-3.5 py-1 rounded-full bg-white/15 text-goldSoft text-xs font-bold">
              {p.parishPatronBadge}
            </span>
            <h2 className="font-serif text-2xl sm:text-3xl font-bold">{p.parishPatronName}</h2>
            <p className="text-sm sm:text-base text-white/90 leading-relaxed">{p.parishPatronIntro}</p>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {p.parishPatronPoints.map((pt) => (
                <div key={pt.title} className="rounded-2xl bg-white/10 backdrop-blur-sm border border-white/15 p-5">
                  <h3 className="font-bold text-goldSoft">{pt.title}</h3>
                  <p className="text-xs sm:text-sm text-white/85 mt-1.5 leading-relaxed">{pt.body}</p>
                </div>
              ))}
            </div>

            <blockquote className="rounded-2xl bg-white/10 border-l-4 border-antiqueGold p-4 italic text-goldSoft text-sm">
              {p.parishPatronQuote}
              <span className="block not-italic text-xs text-white/75 mt-1">— {p.parishPatronQuoteBy}</span>
            </blockquote>

    // 5. SHEPHERDS & STEWARDS (Leadership — Punnakottil Thirumeni right after Madathikandathil Thirumeni)
    function ShepherdsView({ t, photosMap, onSetPhoto }) {
      const sh = t.shepherds;
      const batchRef = useRef(null);

      const handleBatchUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const ids = [
          sh.bishopCard.id,
          sh.emeritusCard.id,
          ...sh.eparchialFeaturedFour.map((x) => x.id),
          ...sh.unitSecretariat.map((x) => x.id),
          ...sh.unitMembers.map((x) => x.id)
        ];
        files.forEach((file, index) => {
          const normalized = file.name.toLowerCase().replace(/[^a-z0-9]/g, '');
          const found = ids.find((id) => normalized.includes(id.replace(/-/g, '').slice(0, 7))) || ids[index];
          if (found) {
            onSetPhoto(found, URL.createObjectURL(file));
          }
        });
      };

      return (
        <div className="page-enter space-y-14">
          <header className="rounded-[2rem] bg-gradient-to-r from-white via-goldSoft/40 to-white border border-antiqueGold/50 p-7 sm:p-10 shadow-sm">
            <div className="flex flex-wrap items-start justify-between gap-4">
              <div>
                <p className="text-xs font-bold uppercase tracking-widest text-saffron">{sh.eyebrow}</p>
                <h1 className="font-serif text-3xl sm:text-4xl font-bold text-crimson mt-1">{sh.title}</h1>
                <p className="text-sm sm:text-base text-stoneMuted mt-1">{sh.subtitle}</p>
              </div>

              <div className="rounded-2xl bg-white border border-hairline p-4 max-w-xs shadow-sm">
                <p className="text-[11px] font-mono text-stoneMuted break-all">
                  Desktop-CML-Official Identity-Website-images
                </p>
                <input
                  ref={batchRef}
                  type="file"
                  accept="image/*"
                  multiple
                  className="hidden"
                  onChange={handleBatchUpload}
                />
                <button
                  type="button"
                  onClick={() => batchRef.current?.click()}
                  className="mt-2 w-full px-4 py-2 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs font-semibold transition-colors"
                >
                  {sh.batchLoadBtn}
                </button>
              </div>
            </div>
          </header>

          {/* SECTION A: EPARCHIAL LEADERSHIP */}

            <div className="border-b border-hairline pb-3">
              <h2 className="font-serif text-2xl sm:text-3xl font-bold text-crimson">
                {sh.eparchialSectionTitle}
              </h2>
            </div>

            {/* Patron Spotlight: Mar George Madathikandathil followed immediately by Mar George Punnakottil */}
            <div className="space-y-4">
              <span className="text-xs font-bold uppercase tracking-wider text-saffron">
                {sh.patronSpotlightLabel}
              </span>
              <LeaderSplitCard
                tier="patron"
                spotlight
                badge={sh.bishopCard.badge}
                name={sh.bishopCard.name}
                position={sh.bishopCard.position}
                description={sh.bishopCard.description}
                photoUrl={photosMap[sh.bishopCard.id]}
                onAttachPhoto={(url) => onSetPhoto(sh.bishopCard.id, url)}
                attachLabel={sh.attachPhotoBtn}
                changeLabel={sh.changePhotoBtn}
                slotLabel={sh.photoSlotLabel}
              />

              <LeaderSplitCard
                spotlight
                badge={sh.emeritusCard.badge}
                name={sh.emeritusCard.name}
                position={sh.emeritusCard.position}
                description={sh.emeritusCard.description}
                photoUrl={photosMap[sh.emeritusCard.id]}
                onAttachPhoto={(url) => onSetPhoto(sh.emeritusCard.id, url)}
                attachLabel={sh.attachPhotoBtn}
                changeLabel={sh.changePhotoBtn}
                slotLabel={sh.photoSlotLabel}
              />
            </div>

            {/* Featured 4: Proto-Syncellus, Syncellus, Syncellus, Director */}
            <div className="space-y-3">
              <span className="text-xs font-bold uppercase tracking-wider text-crimson">

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">

                  <LeaderSplitCard
                    key={leader.id}

                    position={leader.position}
                    description={leader.description}
                    photoUrl={photosMap[leader.id]}

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                {sh.diocesanOthers.map((item) => (
                  <div key={item.role} className="rounded-2xl bg-alabaster border border-hairline p-4">

                {t.unitIdLabel}: {t.unitIdValue} • {t.membersLabel}: {t.membersValue}

            </div>

              <span className="text-xs font-bold uppercase tracking-wider text-saffron">

                  <LeaderSplitCard
                    key={sec.id}
                    spotlight
                    badge={sec.badge}
                    name={sec.name}
                    position={sec.position}
                    description={sec.description}
                    photoUrl={photosMap[sec.id]}
                    onAttachPhoto={(url) => onSetPhoto(sec.id, url)}
                    attachLabel={sh.attachPhotoBtn}
                    changeLabel={sh.changePhotoBtn}
                    slotLabel={sh.photoSlotLabel}
                  />
                ))}
              </div>
            </div>

            {/* Mekhala & Unit Committee */}
            <div className="space-y-4 pt-2">
              <h3 className="font-serif text-xl sm:text-2xl font-bold text-crimson">
                {sh.unitCommitteeTitle}
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                {sh.unitMembers.map((mem) => (
                  <LeaderSplitCard
                    key={mem.id}
                    badge={mem.badge}
                    name={mem.name}
                    position={mem.position}
                    description={mem.description}
                    photoUrl={photosMap[mem.id]}
                    onAttachPhoto={(url) => onSetPhoto(mem.id, url)}

    // 6. DIRECTIVES (Documents & PDF Guidelines)
    function DirectivesView({ t, pdfs, onAttachPdf }) {
      const d = t.directives;
      const ref25 = useRef(null);
      const ref26 = useRef(null);
      const refs = { '2025-2026': ref25, '2026-2027': ref26 };

      return (
        <div className="page-enter space-y-10">
          <header className="rounded-[2rem] bg-gradient-to-r from-white via-goldSoft/40 to-white border border-antiqueGold/50 p-7 sm:p-10 shadow-sm space-y-2">
            <p className="text-xs font-bold uppercase tracking-widest text-saffron">{d.eyebrow}</p>
            <h1 className="font-serif text-3xl sm:text-4xl font-bold text-crimson">{d.title}</h1>
            <p className="text-sm sm:text-base text-stoneMuted">{d.subtitle}</p>
            <p className="text-sm text-charcoal/85 pt-2 max-w-3xl leading-relaxed">{d.intro}</p>
          </header>

          <section className="space-y-5">
            <div>
              <h2 className="font-serif text-2xl font-bold text-crimson">{d.sectionTitle}</h2>
              <p className="text-sm text-stoneMuted mt-1">{d.sectionDesc}</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {d.docs.map((doc) => {
                const attached = pdfs[doc.key];
                return (
                  <div key={doc.key} className="rounded-3xl bg-white/95 border border-hairline p-6 sm:p-7 shadow-sm flex flex-col justify-between space-y-5">
                    <div className="space-y-3">
                      <span className="inline-block px-3.5 py-0.5 rounded-full bg-goldSoft text-crimson text-xs font-bold">
                        {doc.badge}
                      </span>
                      <h3 className="font-serif text-2xl font-bold text-crimson">{doc.title}</h3>
                      <p className="text-sm text-charcoal/80 leading-relaxed">{doc.description}</p>
                      <p className="text-xs font-semibold text-stoneMuted">{d.formatLabel}</p>

                      {attached && (
                        <div className="rounded-2xl bg-alabaster border border-antiqueGold/50 p-3.5 text-xs text-crimson">
                          <strong>{attached.name}</strong> ({attached.sizeKb} KB)
                        </div>
                      )}
                    </div>

                    <div className="flex flex-wrap items-center gap-3 pt-2">
                      <input
                        ref={refs[doc.key]}
                        type="file"
                        accept="application/pdf,.pdf"
                        className="hidden"
                        onChange={(e) => {
                          const file = e.target.files?.[0];
                          if (file) {
                            onAttachPdf(doc.key, {
                              name: file.name,
                              sizeKb: Math.max(1, Math.round(file.size / 1024)),
                              url: URL.createObjectURL(file)
                            });
                          }
                        }}
                      />
                      <button
                        type="button"
                        onClick={() => refs[doc.key].current?.click()}
                        className="px-5 py-2.5 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs sm:text-sm font-semibold transition-colors"
                      >
                        {attached ? d.replaceBtn : d.attachBtn}
                      </button>

                      {attached?.url && (
                        <>
                          <a
                            href={attached.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="px-4 py-2.5 rounded-full bg-alabaster hover:bg-goldSoft/60 text-crimson border border-hairline text-xs sm:text-sm font-semibold transition-colors"
                          >
                            {d.previewBtn}
                          </a>
                          <a
                            href={attached.url}
                            download={attached.name}
                            className="px-4 py-2.5 rounded-full bg-goldSoft hover:bg-antiqueGold/30 text-crimson border border-antiqueGold/45 text-xs sm:text-sm font-semibold transition-colors"
                          >
                            {d.downloadBtn}
                          </a>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </section>
        </div>
      );
    }

            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-goldSoft">{c.videoTag}</span>
                <h2 className="font-serif text-2xl font-bold mt-1">{c.videoTitle}</h2>
                <p className="text-sm text-white/85 mt-1 max-w-2xl">{c.videoSub}</p>
              </div>

                href={SOCIAL_LINKS.youtube}

                {c.visitYoutube}

          </section>

          {/* Visual Archive */}
          <section className="rounded-[2rem] bg-white/95 border border-hairline p-6 sm:p-9 shadow-sm space-y-5">

              <div>
                <h2 className="font-serif text-2xl font-bold text-crimson">{c.galleryTitle}</h2>
                <p className="text-xs sm:text-sm text-stoneMuted mt-0.5">{c.gallerySub}</p>
              </div>
              <input
                ref={uploadRef}
                type="file"
                accept="image/*"
                multiple
                className="hidden"
                onChange={(e) => {
                  const files = Array.from(e.target.files || []);
                  if (!files.length) return;
                  const next = files.map((f) => ({
                    id: `${f.name}-${Date.now()}-${Math.random()}`,
                    title: f.name.replace(/\.[^/.]+$/, ''),
                    url: URL.createObjectURL(f)
                  }));
                  setPhotos((prev) => [...next, ...prev]);
                }}
              />
              <button
                type="button"
                onClick={() => uploadRef.current?.click()}
                className="px-5 py-2.5 rounded-full bg-crimson hover:bg-crimsonDeep text-white text-xs font-semibold transition-colors"
              >
                {c.addPhotosBtn}

                  <LittleFlowerCrest className="w-12 h-12 mb-3" />

                <p className="text-[11px] text-stoneMuted mt-0.5">{t.unitIdValue}</p>
              </div>

              {photos.map((item) => (
                <div key={item.id} className="rounded-3xl bg-alabaster border border-hairline overflow-hidden">
                  <img src={item.url} alt={item.title} className="w-full h-44 object-cover" />
                  <p className="p-3.5 text-xs font-semibold text-charcoal truncate">{item.title}</p>
                </div>
              ))}
            </div>
          </section>
        </div>
      );
    }

    // 8. CONNECT (Contact Us — 3 Dedicated Direct WhatsApp Message Modes to +91 7559879490)
    function ConnectView({ t }) {
      const c = t.connect;
      const [mode, setMode] = useState('prayer');

      // Prayer Intention state
      const [prayerName, setPrayerName] = useState('');
      const [prayerPhone, setPrayerPhone] = useState('');
      const [prayerIntention, setPrayerIntention] = useState('');

      // Member Enquiry state
      const [enquirerName, setEnquirerName] = useState('');
      const [enquirerIdentity, setEnquirerIdentity] = useState('');
      const [enquirerPhone, setEnquirerPhone] = useState('');
      const [enquirerEmail, setEnquirerEmail] = useState('');
      const [targetMember, setTargetMember] = useState('');
      const [enquiryReason, setEnquiryReason] = useState('');

      // General Information state
      const [genName, setGenName] = useState('');
      const [genPhone, setGenPhone] = useState('');
      const [genEmail, setGenEmail] = useState('');
      const [genQuery, setGenQuery] = useState('');

      const [sentBadge, setSentBadge] = useState('');
      const cleanMain = SOCIAL_LINKS.mainPhone.replace('+', '');

      const sendToMainWhatsApp = (e) => {
        e.preventDefault();
        let composed = '';

        if (mode === 'prayer') {
          composed = [
            `[${t.unitName} (${t.unitIdValue}) — ${c.tabs.prayer.label}]`,
            `${c.tabs.prayer.fields.name}: ${prayerName || '-'}`,
            `${c.tabs.prayer.fields.phone}: ${prayerPhone || '-'}`,
            `${c.tabs.prayer.fields.intention}: ${prayerIntention || '-'}`
          ].join('\n');
        } else if (mode === 'member') {
          composed = [
            `[${t.unitName} (${t.unitIdValue}) — ${c.tabs.member.label}]`,
            `${c.tabs.member.fields.enquirerName}: ${enquirerName || '-'}`,
            `${c.tabs.member.fields.enquirerIdentity}: ${enquirerIdentity || '-'}`,
            `${c.tabs.member.fields.phone}: ${enquirerPhone || '-'}`,
            `${c.tabs.member.fields.email}: ${enquirerEmail || '-'}`,
            `${c.tabs.member.fields.targetMember}: ${targetMember || '-'}`,
            `${c.tabs.member.fields.reason}: ${enquiryReason || '-'}`
          ].join('\n');
        } else {
          composed = [
            `[${t.unitName} (${t.unitIdValue}) — ${c.tabs.general.label}]`,
            `${c.tabs.general.fields.name}: ${genName || '-'}`,
            `${c.tabs.general.fields.phone}: ${genPhone || '-'}`,
            `${c.tabs.general.fields.email}: ${genEmail || '-'}`,
            `${c.tabs.general.fields.query}: ${genQuery || '-'}`
          ].join('\n');
        }

        setSentBadge(SOCIAL_LINKS.mainPhone);
        window.open(`https://wa.me/${cleanMain}?text=${encodeURIComponent(composed)}`, '_blank', 'noopener,noreferrer');
      };

        <div className="page-enter space-y-12">

            <h1 className="font-serif text-3xl sm:text-4xl font-bold text-crimson">{c.title}</h1>
            <p className="text-sm sm:text-base text-stoneMuted">{c.subtitle}</p>
            <p className="text-sm text-charcoal/85 pt-1 leading-relaxed">{c.intro}</p>
          </header>

          {/* Top 3 Contact Cards */}

              <p className="text-xs text-stoneMuted leading-relaxed">{c.callDesc}</p>
              <div className="space-y-2 pt-1">
                <div>
                  <span className="text-[11px] uppercase font-bold text-saffron block">{c.mainPhoneLabel}</span>
                  <a href={`tel:${SOCIAL_LINKS.mainPhone}`} className="text-base font-extrabold text-crimson hover:underline">
                    {SOCIAL_LINKS.mainPhone}
                  </a>
                </div>
                <div>
                  <span className="text-[11px] uppercase font-bold text-stoneMuted block">{c.secondaryPhoneLabel}</span>
                  <a href={`tel:${SOCIAL_LINKS.secondaryPhone}`} className="text-sm font-bold text-charcoal hover:underline">
                    {SOCIAL_LINKS.secondaryPhone}
                  </a>
                </div>
              </div>
            </div>

            <div className="rounded-3xl bg-white/95 border border-hairline p-6 shadow-sm space-y-3">
              <h2 className="font-serif text-xl font-bold text-crimson">{c.emailTitle}</h2>
              <p className="text-xs text-stoneMuted leading-relaxed">{c.emailDesc}</p>
              <p className="pt-2">
                <a
                  href={`mailto:${SOCIAL_LINKS.email}`}

                  {SOCIAL_LINKS.email}
                </a>
              </p>
            </div>

            <div className="rounded-3xl bg-white/95 border border-hairline p-6 shadow-sm space-y-3">

              <p className="text-xs text-stoneMuted leading-relaxed">{c.whatsappDesc}</p>
              <div className="flex flex-wrap gap-2 pt-2">
                <a
                  href={`https://wa.me/${cleanMain}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="px-4 py-2 rounded-full bg-emeraldSacred text-white text-xs font-bold hover:brightness-110 transition-all"

                      </div>
                      <div>
                        <label className="block text-xs font-bold text-crimson mb-1.5">

                        <input
                          type="tel"

                          {c.tabs.member.fields.enquirerName}
                        </label>
                        <input
                          type="text"
                          required
                          value={enquirerName}
                          onChange={(e) => setEnquirerName(e.target.value)}
                          placeholder={c.tabs.member.fields.enquirerNamePh}
                          className="w-full rounded-2xl border border-hairline bg-alabaster px-4 py-2.5 text-sm focus:outline-none focus:border-crimson"
                        />

                      <div>

                        </label>
                        <input

                          required

                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-crimson mb-1.5">
                          {c.tabs.member.fields.phone}
                        </label>
                        <input
                          type="tel"
                          required
                          value={enquirerPhone}
                          onChange={(e) => setEnquirerPhone(e.target.value)}
                          placeholder={c.tabs.member.fields.phonePh}
                          className="w-full rounded-2xl border border-hairline bg-alabaster px-4 py-2.5 text-sm focus:outline-none focus:border-crimson"
                        />
                      </div>
                      <div>

                        </label>
                        <input
                          type="email"
                          value={enquirerEmail}

                          required

                          onChange={(e) => setGenName(e.target.value)}

            {/* Right Column: Visit Church + Social Platforms */}

    // =========================================================================
    function App() {
      const [lang, setLang] = useState('en');
      const [activeTab, setActiveTab] = useState('sanctuary');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const [unitLogoUrl, setUnitLogoUrl] = useState('');
      const [cmlFlagUrl, setCmlFlagUrl] = useState('');
      const [cmlBadgeUrl, setCmlBadgeUrl] = useState('');
      const [churchPhotoUrl, setChurchPhotoUrl] = useState('');

      const [photosMap, setPhotosMap] = useState({});
      const [pdfs, setPdfs] = useState({ '2025-2026': null, '2026-2027': null });

      const t = CONTENT[lang];

      useEffect(() => {
        document.documentElement.lang = lang;
        document.title = `${t.unitName} (${t.unitIdValue})`;
      }, [lang, t]);

      const navigateTo = (id) => {
        setActiveTab(id);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const setPhoto = (id, url) => {
        setPhotosMap((prev) => ({ ...prev, [id]: url }));
      };

      const setPdf = (key, data) => {
        setPdfs((prev) => ({ ...prev, [key]: data }));
      };

      const activeNavItem = t.nav.find((n) => n.id === activeTab) || t.nav[0];
      const activeIdx = t.nav.findIndex((n) => n.id === activeTab);

      return (
        <div className="min-h-screen flex flex-col bg-alabaster sanctuary-mesh text-charcoal">
          {/* Top Continuous Single-Direction Scrolling Marquee + Language Switcher */}
          <div className="bg-gradient-to-r from-crimsonDeep via-[#5A1125] to-sapphire text-white text-xs border-b border-antiqueGold/35">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex items-center justify-between gap-3">
              {/* Continuous Single-Direction Moving Marquee */}
              <div className="marquee-wrapper flex-1 overflow-hidden relative py-0.5">
                <div className="marquee-track">
                  {[0, 1, 2, 3].map((idx) => (
                    <span key={idx} className="inline-flex items-center gap-3 pr-12 whitespace-nowrap font-medium text-goldSoft">
                      <SacredCross className="w-3.5 h-3.5 text-antiqueGold shrink-0" />
                      <span>{t.marqueeText}</span>
                    </span>
                  ))}
                </div>
              </div>

              {/* Pure English / Pure Malayalam Toggle */}
              <div
                role="group"
                aria-label="Language Switcher"
                className="inline-flex rounded-full bg-black/25 p-0.5 border border-antiqueGold/45 shrink-0"
              >
                <button
                  type="button"
                  onClick={() => setLang('en')}
                  className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${
                    lang === 'en'
                      ? 'bg-antiqueGold text-crimsonDeep shadow-sm'
                      : 'text-white/85 hover:text-white'
                  }`}
                >
                  English
                </button>
                <button
                  type="button"
                  onClick={() => setLang('ml')}
                  className={`px-3 py-1 rounded-full text-[11px] font-malayalam font-bold transition-all ${
                    lang === 'ml'
                      ? 'bg-antiqueGold text-crimsonDeep shadow-sm'
                      : 'text-white/85 hover:text-white'
                  }`}
                >
                  മലയാളം
                </button>
              </div>
            </div>
          </div>

          {/* Sticky Glass Navigation Header */}
          <header className="sticky top-0 z-40 bg-ivoryGlass backdrop-blur-xl border-b border-hairline shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
              {/* Brand */}
              <button
                type="button"
                onClick={() => navigateTo('sanctuary')}
                className="flex items-center gap-3 text-left group min-w-0"
              >
                {unitLogoUrl ? (
                  <img
                    src={unitLogoUrl}
                    alt={t.unitName}
                    className="w-10 h-10 rounded-2xl object-contain border border-antiqueGold/50 bg-white p-1 shrink-0"
                  />
                ) : (
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-goldSoft to-amber-100 border border-antiqueGold/50 flex items-center justify-center shrink-0">
                    <LittleFlowerCrest className="w-7 h-7" />
                  </div>
                )}
                <div className="min-w-0">
                  <span className="block font-serif font-bold text-crimson text-base sm:text-lg leading-tight truncate group-hover:text-saffron transition-colors">
                    {t.unitName}
                  </span>
                  <span className="block text-[11px] text-stoneMuted truncate">
                    {t.churchName}
                  </span>
                </div>
              </button>

              {/* Desktop 9-Section Pill Navigation */}
              <nav aria-label="Primary Navigation" className="hidden xl:flex items-center gap-1 bg-alabaster/90 p-1 rounded-full border border-hairline">
                {t.nav.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => navigateTo(item.id)}
                      className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all ${
                        isActive
                          ? 'bg-gradient-to-r from-crimson to-sapphire text-white shadow-sm'
                          : 'text-charcoal/80 hover:bg-goldSoft/65 hover:text-crimson'
                      }`}
                    >
                      {item.label}
                    </button>
                  );
                })}
              </nav>

              {/* Mobile / Tablet Menu Button */}
              <button
                type="button"
                onClick={() => setMobileMenuOpen((v) => !v)}
                className="xl:hidden inline-flex items-center gap-2 px-4 py-2 rounded-full border border-hairline bg-white text-crimson text-xs font-bold shadow-sm"
                aria-expanded={mobileMenuOpen}
              >
                <span>{activeNavItem.label}</span>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                  {mobileMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 7h16M4 12h16M4 17h16" />
                  )}
                </svg>
              </button>
            </div>

            {/* Horizontal Pill Strip for Mobile/Tablet */}
            <div className="xl:hidden border-t border-hairline/70 bg-alabaster/90">
              <div className="max-w-7xl mx-auto px-4 py-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                {t.nav.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => navigateTo(item.id)}
                      className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${
                        isActive
                          ? 'bg-gradient-to-r from-crimson to-sapphire text-white'
                          : 'bg-white text-charcoal/80 border border-hairline hover:border-antiqueGold'
                      }`}
                    >
                      {item.label}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Expandable Drawer */}
            {mobileMenuOpen && (
              <div className="xl:hidden border-t border-hairline bg-white px-4 py-4 shadow-xl">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-w-7xl mx-auto">
                  {t.nav.map((item) => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => navigateTo(item.id)}
                        className={`flex items-center justify-between px-4 py-2.5 rounded-2xl text-left text-xs font-bold ${
                          isActive
                            ? 'bg-gradient-to-r from-crimson to-sapphire text-white'
                            : 'bg-alabaster text-charcoal hover:bg-goldSoft/60'
                        }`}
                      >
                        <span>{item.label}</span>
                        <span className="font-serif opacity-75">{item.num}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </header>

          {/* Main View */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
            {activeTab === 'sanctuary' && (
              <SanctuaryView t={t} onNavigate={navigateTo} unitLogoUrl={unitLogoUrl} />
            )}
            {activeTab === 'mission' && (
              <MissionView
                t={t}
                unitLogoUrl={unitLogoUrl}
                onUploadUnitLogo={setUnitLogoUrl}
                cmlFlagUrl={cmlFlagUrl}
                onUploadCmlFlag={setCmlFlagUrl}
                cmlBadgeUrl={cmlBadgeUrl}
                onUploadCmlBadge={setCmlBadgeUrl}
              />
            )}
            {activeTab === 'intercessors' && <IntercessorsView t={t} />}
            {activeTab === 'parish' && (
              <ParishView
                t={t}
                churchPhotoUrl={churchPhotoUrl}
                onUploadChurchPhoto={setChurchPhotoUrl}
              />
            )}
            {activeTab === 'shepherds' && (
              <ShepherdsView t={t} photosMap={photosMap} onSetPhoto={setPhoto} />
            )}
            {activeTab === 'directives' && (
              <DirectivesView t={t} pdfs={pdfs} onAttachPdf={setPdf} />
            )}
            {activeTab === 'chronicles' && (
              <ChroniclesView t={t} unitLogoUrl={unitLogoUrl} />
            )}
            {activeTab === 'connect' && <ConnectView t={t} />}
            {activeTab === 'thanksgiving' && <ThanksgivingView t={t} />}

            {/* Refined Section Stepper */}
            <div className="mt-14 pt-6 border-t border-hairline flex items-center justify-between gap-4">
              <div>
                {activeIdx > 0 ? (
                  <button
                    type="button"
                    onClick={() => navigateTo(t.nav[activeIdx - 1].id)}
                    className="px-5 py-2.5 rounded-full bg-white hover:bg-goldSoft/60 border border-hairline text-xs sm:text-sm font-bold text-crimson transition-colors"
                  >
                    ← {t.nav[activeIdx - 1].label}
                  </button>
                ) : (
                  <span />
                )}
              </div>

              <span className="text-xs font-serif font-bold text-stoneMuted">
                {activeNavItem.num} / IX
              </span>

              <div>
                {activeIdx < t.nav.length - 1 ? (
                  <button
                    type="button"
                    onClick={() => navigateTo(t.nav[activeIdx + 1].id)}
                    className="px-5 py-2.5 rounded-full bg-gradient-to-r from-crimson to-sapphire hover:brightness-110 text-white text-xs sm:text-sm font-bold transition-all shadow-sm"
                  >
                    {t.nav[activeIdx + 1].label} →
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={() => navigateTo('sanctuary')}
                    className="px-5 py-2.5 rounded-full bg-gradient-to-r from-crimson to-sapphire hover:brightness-110 text-white text-xs sm:text-sm font-bold transition-all shadow-sm"
                  >
                    {t.nav[0].label} ↑
                  </button>
                )}
              </div>
            </div>
          </main>

          {/* Pure Single-Language Footer */}
          <footer className="bg-gradient-to-r from-crimsonDeep via-[#4D1020] to-sapphire text-white border-t border-antiqueGold/35 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8 text-xs sm:text-sm">
              <div className="space-y-2">
                <p className="font-serif font-bold text-goldSoft text-lg">{t.unitName}</p>
                <p className="text-white/85">
                  {t.unitIdLabel}: <strong>{t.unitIdValue}</strong> • {t.membersLabel}: <strong>{t.membersValue}</strong>
                </p>
                <p className="text-goldSoft/95 text-xs font-semibold">{t.mission.sloganValue}</p>
              </div>

              <div className="space-y-2 text-white/85">
                <p className="font-bold text-goldSoft">{t.churchName}</p>
                <p className="text-xs leading-relaxed">
                  {t.connect.addressLines[1]} {t.connect.addressLines[2]}
                </p>
                <p className="text-xs">{t.dioceseName}</p>
              </div>

              <div className="space-y-2 text-white/85">
                <p className="font-bold text-goldSoft">{t.connect.title}</p>
                <p className="text-xs">
                  {t.connect.mainPhoneLabel}:{' '}
                  <a href={`tel:${SOCIAL_LINKS.mainPhone}`} className="underline hover:text-goldSoft">
                    {SOCIAL_LINKS.mainPhone}
                  </a>
                </p>
                <p className="text-xs">
                  {t.connect.secondaryPhoneLabel}:{' '}
                  <a href={`tel:${SOCIAL_LINKS.secondaryPhone}`} className="underline hover:text-goldSoft">
                    {SOCIAL_LINKS.secondaryPhone}
                  </a>
                </p>
                <p className="text-xs break-all">{SOCIAL_LINKS.email}</p>
                <div className="flex flex-wrap gap-3 pt-1 text-xs">
                  <a href={SOCIAL_LINKS.instagram} target="_blank" rel="noopener noreferrer" className="underline hover:text-goldSoft">Instagram</a>
                  <a href={SOCIAL_LINKS.facebook} target="_blank" rel="noopener noreferrer" className="underline hover:text-goldSoft">Facebook</a>
                  <a href={SOCIAL_LINKS.threads} target="_blank" rel="noopener noreferrer" className="underline hover:text-goldSoft">Threads</a>
                  <a href={SOCIAL_LINKS.x} target="_blank" rel="noopener noreferrer" className="underline hover:text-goldSoft">X</a>
                  <a href={SOCIAL_LINKS.youtube} target="_blank" rel="noopener noreferrer" className="underline hover:text-goldSoft">YouTube</a>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
